<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SSL open Zoho Projects — El Paso / Las Cruces</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
#app{display:flex;height:100%}#side{width:340px;overflow:auto;border-right:1px solid #ccc;background:#fafafa;display:flex;flex-direction:column}
#map{flex:1}header{padding:10px;background:#123;color:#fff}header h1{font-size:16px;margin:0}header small{opacity:.8}
#legend{padding:8px;display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:12px;padding:4px 8px;border-radius:12px;border:1px solid #999;cursor:pointer;user-select:none}
.chip.off{opacity:.45}.chip input{width:16px;height:16px;margin:0;cursor:pointer}.chip{cursor:pointer}#q{margin:6px 8px;padding:8px;font-size:15px}#list{flex:1;overflow:auto}
.item{padding:8px 10px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px}.item:hover{background:#eef}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #333}
.pop a{display:inline-block;margin:3px 6px 3px 0;padding:6px 8px;background:#1565c0;color:#fff;border-radius:4px;text-decoration:none;font-size:13px}
.stale{display:none;background:#b71c1c;color:#fff;padding:6px 10px;font-size:13px}.upd{margin-top:6px}.upd button{background:#2e7d32;color:#fff;border:0;border-radius:4px;padding:6px 14px;font-size:14px;cursor:pointer}.upd button:disabled{background:#777;cursor:default}.upd a{color:#9cf;font-size:11px;cursor:pointer;text-decoration:underline}.upd small{display:block;margin-top:4px}.na{color:#999;font-size:12px;display:block}#toggle{display:none}
@media(max-width:700px){html,body{height:100dvh}#app{flex-direction:column;height:100dvh}#map{order:1;flex:1;min-height:0}#side{order:2;width:100%;height:auto;max-height:58dvh;border-right:0;border-top:2px solid #123;flex:none}
header{padding:6px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}header h1{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header small{width:100%;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toggle{display:inline-block;order:2;background:#fff;border:0;padding:6px 12px;border-radius:14px;font-size:13px;font-weight:600}
.upd{margin:0;padding:2px 10px 4px;background:#123;color:#fff}.upd small{font-size:11px}.stale{font-size:11px;padding:4px 10px}
#side.min #legend,#side.min #q,#side.min #list{display:none}#legend{padding:6px 8px;max-height:30dvh;overflow:auto}.chip{padding:5px 8px}#q{margin:4px 8px;padding:6px;font-size:14px}.item{padding:6px 10px}
.leaflet-control-layers{margin-top:6px}}
</style></head><body><div id="app"><div id="side">
<header><button id="toggle" onclick="toggleSide()">Filters &amp; list ▲</button><h1>SSL open Zoho Projects — El Paso / Las Cruces</h1><small id="meta">loading…</small></header><div class="upd" id="upd"></div><div id="stale" class="stale"></div>
<div id="legend"></div><input id="q" placeholder="Search name, PRJ, address…"><div id="list"></div></div><div id="map"></div></div>
<script>
const side=document.getElementById('side');
function toggleSide(){side.classList.toggle('min');syncT();setTimeout(()=>map.invalidateSize(),60)}
function syncT(){const t=document.getElementById('toggle');if(t)t.innerHTML=side.classList.contains('min')?'Filters &amp; list ▲':'Hide ▼'}
if(innerWidth<=700)side.classList.add('min');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'});
const lbl=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const map=L.map('map',{layers:[sat,lbl],tap:true}).setView([31.95,-106.5],9);
L.control.layers({'Satellite':L.layerGroup([sat,lbl]),'Streets':street}).addTo(map);
const CATS=[{k:'ns',n:'Not started',c:'#f9a825'},{k:'st',n:'Started',c:'#1e88e5'},{k:'in',n:'Inspections',c:'#8e24aa'},{k:'co',n:'Collections / accounting / completed',c:'#2e7d32'}];
function catOf(o){const m=/^\s*(\d+)/.exec(o.stage||'');const n=m?(m[1].length===3&&m[1][0]==='0'?parseInt(m[1],10)/10:parseInt(m[1],10)):null;const nm=(o.stage||'').toLowerCase();
if(nm==='completed'||nm.includes('collect')||nm.includes('accounting'))return 'co';if(nm.includes('inspection'))return 'in';
if(n!==null){if(n>=10)return 'co';if(n===8)return 'in';if(n>=5)return 'st';return 'ns'}return 'ns'}
const catInfo=k=>CATS.find(x=>x.k===k);
let P=[],markers={},off=new Set(),offS=new Set(),mode='groups',layer=L.layerGroup().addTo(map),first=true;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=c=>/^#[0-9a-fA-F]{3,8}$/.test(c||'')?c:'#888';
const lk=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:`<span class="na">${t} unavailable</span>`;
function pop(o){const dir=o.address?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(o.address):null;
return `<div class="pop"><b>${esc(o.name)}</b><br>${esc(o.prj)} · <span style="background:${catInfo(o.cat).c};color:#fff;padding:1px 5px;border-radius:3px">${esc(o.stage)}</span><br>
${esc(o.address||'address unavailable')}${o.outside?' <i>(outside El Paso/Las Cruces area)</i>':''}<br>
📞 ${o.phone?`<a href="tel:${o.phone.replace(/\D/g,'')}">${esc(o.phone)}</a>`:'<span class="na">phone unavailable</span>'}<br>
${lk(o.zoho,'Zoho Projects')}${lk(o.companycam,'CompanyCam')}${lk(o.fsm,'FSM WO'+(o.fsm_wo?' '+esc(o.fsm_wo):''))}${lk(o.podium,'Podium contact')}${lk(dir,'Directions')}</div>`}
function render(){layer.clearLayers();markers={};const q=document.getElementById('q').value.toLowerCase();const list=document.getElementById('list');list.innerHTML='';const b=[];
CATS.forEach(cg=>{const items=P.filter(o=>o.cat===cg.k&&!off.has(cg.k)&&!offS.has(o.stage)&&(!q||(o.name+o.prj+(o.address||'')).toLowerCase().includes(q)));if(!items.length)return;
 const h=document.createElement('div');h.style.cssText='padding:6px 10px;font-weight:600;font-size:13px;color:#fff;background:'+cg.c;h.textContent=cg.n+' ('+items.length+')';list.appendChild(h);
 items.forEach(o=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<span class="dot" style="background:${cg.c}"></span><b>${esc(o.prj)}</b> ${esc(o.name)}<br><small>${esc(o.stage)} · ${esc(o.address||'no address')}</small>`;
 if(o.lat){const m=L.circleMarker([o.lat,o.lng],{radius:9,color:'#000',weight:1.5,fillColor:cg.c,fillOpacity:.95}).bindPopup(pop(o),{maxWidth:300}).addTo(layer);markers[o.id]=m;if(!o.outside)b.push([o.lat,o.lng]);
 d.onclick=()=>{map.setView([o.lat,o.lng],16);m.openPopup();if(innerWidth<=700){side.classList.add('min');syncT();setTimeout(()=>map.invalidateSize(),60)}}}
 list.appendChild(d)})});
 if(first&&b.length){map.fitBounds(b,{padding:[30,30]});first=false}}
function legend(){const el=document.getElementById('legend');el.innerHTML='';
const bar=document.createElement('div');bar.style.cssText='width:100%;display:flex;gap:6px;align-items:center;font-size:12px;margin-bottom:2px';bar.appendChild(document.createTextNode('Filter by:'));
[['groups','4 groups'],['statuses','Each status']].forEach(([m,t])=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='padding:3px 10px;border:1px solid #1565c0;border-radius:12px;cursor:pointer;background:'+(mode===m?'#1565c0':'#fff')+';color:'+(mode===m?'#fff':'#1565c0');b.onclick=()=>{mode=m;off.clear();offS.clear();legend();render()};bar.appendChild(b)});
if(mode==='statuses'){[['All',()=>offS.clear()],['None',()=>P.forEach(o=>offS.add(o.stage))]].forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='padding:3px 8px;border:1px solid #888;border-radius:12px;cursor:pointer;background:#fff;margin-left:auto'+(t==='None'?';margin-left:0':'');b.onclick=()=>{f();legend();render()};bar.appendChild(b)})}
el.appendChild(bar);
const mk=(label,color,n,isOff,toggle)=>{const lb=document.createElement('label');lb.className='chip';lb.style.cssText='background:'+color+';color:#fff;border-color:#333;display:flex;align-items:center;gap:6px';
const cb=document.createElement('input');cb.type='checkbox';cb.checked=!isOff;cb.setAttribute('aria-label','Show '+label);cb.onchange=()=>{toggle(cb.checked);lb.classList.toggle('off',!cb.checked);render()};
lb.classList.toggle('off',isOff);lb.appendChild(cb);lb.appendChild(document.createTextNode(`${label} (${n})`));el.appendChild(lb)};
if(mode==='groups'){CATS.forEach(cg=>mk(cg.n,cg.c,P.filter(o=>o.cat===cg.k).length,off.has(cg.k),on=>on?off.delete(cg.k):off.add(cg.k)))}
else{const st={};P.forEach(o=>{st[o.stage]=st[o.stage]||{n:0,cat:o.cat};st[o.stage].n++});Object.keys(st).sort().forEach(k=>mk(k,catInfo(st[k].cat).c,st[k].n,offS.has(k),on=>on?offS.delete(k):offS.add(k)))}}
async function load(){let j;try{const r=await fetch('projects.json?t='+Date.now());j=await r.json()}catch(e){const st=document.getElementById('stale');st.style.display='block';st.textContent='Warning: could not load data. Showing last loaded data, if any.';return}P=j.projects;P.forEach(o=>o.cat=catOf(o));window.GEN=j.generated;
document.getElementById('meta').textContent=`${P.length} open · ${P.filter(o=>o.lat).length} mapped · data updated ${j.generated} · updates about every 30 min on weekdays, 6am-8pm Mountain · page rechecks every 30 min`;const age=(Date.now()-new Date(String(j.generated).replace(/([+-]\d\d)(\d\d)$/,'$1:$2')).getTime())/60000;const st=document.getElementById('stale');
if(isNaN(age)||age>30){st.style.display='block';st.textContent=isNaN(age)?'Warning: last-updated time unknown, data may be out of date.':`Warning: data is ${Math.round(age)} minutes old and may be out of date.`}else st.style.display='none';
legend();render()}
document.getElementById('q').oninput=render;load();setInterval(load,1800000);

/* Update button: cosmetic client-side gating only. A GitHub token (Issues: write on this repo) is stored in this browser; the page asks GitHub who it belongs to and shows Update only for allowlisted logins. Pressing it opens an "Update request" issue that the map owner's assistant picks up. */
const ALLOW=['xlukex15'];const REPO='Solar-Smart-Living-Peak-Comfort-HVAC/ssl-open-projects-map';let who=null,busy=false;
const gh=(p,o={})=>fetch('https://api.github.com'+p,Object.assign({headers:{Authorization:'Bearer '+localStorage.ghTok,Accept:'application/vnd.github+json'}},o));
const uEl=document.getElementById('upd');
async function initUpd(){uEl.innerHTML='';if(!localStorage.ghTok){uEl.innerHTML='<a id="si">Owner sign-in</a>';document.getElementById('si').onclick=()=>{const t=prompt('Paste your GitHub token (Issues: write on '+REPO+'). It stays in this browser only.');if(t){localStorage.ghTok=t.trim();initUpd()}};return}
try{const r=await gh('/user');if(!r.ok)throw 0;who=(await r.json()).login}catch(e){delete localStorage.ghTok;initUpd();return}
if(!ALLOW.includes(who.toLowerCase())){uEl.innerHTML='<small>Signed in as '+esc(who)+' (no Update access) · <a id="so">sign out</a></small>';document.getElementById('so').onclick=()=>{delete localStorage.ghTok;initUpd()};return}
uEl.innerHTML='<button id="ub">Update</button> <a id="so">sign out</a><small id="us"></small>';document.getElementById('so').onclick=()=>{delete localStorage.ghTok;initUpd()};document.getElementById('ub').onclick=doUpdate}
async function doUpdate(){if(busy)return;busy=true;const b=document.getElementById('ub'),us=document.getElementById('us');b.disabled=true;b.textContent='Updating…';
try{const prev=window.GEN;const ex=await (await gh('/repos/'+REPO+'/issues?state=open&creator='+who+'&per_page=20')).json();
if(!ex.some(i=>/^Update request/.test(i.title))){const r=await gh('/repos/'+REPO+'/issues',{method:'POST',body:JSON.stringify({title:'Update request',body:'Requested from the map page by '+who+' at '+new Date().toISOString()})});if(!r.ok)throw new Error('GitHub '+r.status)}
us.textContent='Update requested. This usually takes a few minutes; the map reloads itself when new data lands.';
const t0=Date.now();while(Date.now()-t0<15*60000){await new Promise(r=>setTimeout(r,20000));const j=await (await fetch('projects.json?t='+Date.now())).json();if(j.generated!==prev){await load();us.textContent='Updated '+j.generated;break}}
if(window.GEN===prev)us.textContent='Still waiting. The data will show up on the next page check.'}
catch(e){us.textContent='Could not send the update request ('+e.message+').'}
b.disabled=false;b.textContent='Update';busy=false}
initUpd();
</script></body></html>
